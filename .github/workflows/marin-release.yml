name: Marin package release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: "3.12.14"
      - name: Build both packages from matching tags
        run: |
          bash scripts/build_marin_release.sh "${GITHUB_REF_NAME#v}" dist
      - name: Install the built wheels with the Marin CPU profile
        run: |
          uv venv .release-test
          uv pip install --python .release-test/bin/python --torch-backend cpu \
            'torch==2.11.0' 'torchvision==0.26.0' 'torchaudio==2.11.0'
          uv pip install --python .release-test/bin/python \
            'transformers==5.16.1' 'pytest==9.1.1' 'pytest-mock==3.15.1' \
            'pytest-asyncio==1.4.0' dist/*.whl
      - name: Test the installed packages
        run: |
          .release-test/bin/python - <<'PY'
          from importlib.metadata import requires, version
          import os
          expected = os.environ["GITHUB_REF_NAME"][1:]
          assert version("speculators") == version("hs-connectors") == expected
          assert f"hs-connectors=={expected}" in requires("speculators")
          assert all("file:" not in requirement for requirement in requires("speculators"))
          PY
          .release-test/bin/python -m pytest \
            tests/unit/models/test_eagle3_gated_verifier.py \
            tests/unit/train/test_draft_config_init.py \
            tests/unit/train/test_setup_model.py
      - name: Publish immutable prerelease artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; leaving its assets unchanged." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/SHA256SUMS dist/SOURCE_COMMIT \
            --verify-tag --prerelease --title "Marin Speculators ${GITHUB_REF_NAME#v}" \
            --notes 'Built from the matching Speculators and hs-connectors source tags. Source and wheel hashes accompany the packages.'
